name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Check formatting
        run: ./gradlew ktlintCheck

      - name: Build and test
        run: ./gradlew build

      - name: Build installable distribution
        run: ./gradlew :mcp-server:installDist

      - name: Upload installDist artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcp-server-installDist
          path: mcp-server/build/install/mcp-server
          if-no-files-found: error
